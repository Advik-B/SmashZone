<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Zoom stays enabled for accessibility. During gameplay the full-screen
      #touch-controls overlay (touch-action: none) already prevents
      pinch/double-tap zoom; on menus the overlay is hidden so text is zoomable.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SmashZone</title>
    <meta
      name="description"
      content="A fast 3D party brawler — create a room, share the code, knock everyone off the arena."
    />

    <!-- Installable app: manifest + icons. The worker that makes it work
         offline is registered from src/pwa/register.ts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0d1c" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iOS ignores the manifest: it wants its own icon and meta tags. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmashZone" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
