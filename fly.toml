# fly.toml app configuration file generated for smashzone on 2026-09-27T10:30:34Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'smashzone'
primary_region = 'maa'
# Give the process time to notify rooms and flush the "restarting" notice
# before Fly hard-kills it on deploy / auto-stop.
kill_timeout = '5s'

# NOTE: rooms live in per-machine memory with no shared registry, so this app
# is correct only on a single machine. Keep max_machines effectively at 1
# (scale up would route friends to different machines → "room not found").

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  checks = [{ grace_period = '10s', interval = '15s', method = 'GET', path = '/api/health', timeout = '2s' }]

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
